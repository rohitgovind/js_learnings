<head>

</head>
<body>
    <button type="button" id="button" onclick="colorChange()"> change to dark color</button>
    <p> hello world </p>

<script>
    function colorChange(){
        const bodyColor = document.querySelector('Body')
        bodyColor.style.backgroundColor = 'black'
        bodyColor.style.color = 'white'
        document.body.appendChild('bodyColor')
    }
</script>
